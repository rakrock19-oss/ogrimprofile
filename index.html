    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoxDqfXbM-5uT5zKq0RGvXnjIoS31H5cd81kUzMJGgcZq0K9uMd1FMYps1odyubTtQtg/exec";

        // 이메일 복사 기능
        function copyEmail() {
            const email = "ogrim6012@gmail.com";
            
            const tempInput = document.createElement("input");
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            const copyBtnText = document.getElementById("copyBtnText");
            const toast = document.getElementById("copyToast");
            
            copyBtnText.innerText = "복사됨!";
            toast.classList.remove("hidden");

            setTimeout(() => {
                copyBtnText.innerText = "복사";
                toast.classList.add("hidden");
            }, 2500);
        }

        // 방명록 데이터 불러오기 (GET)
        async function fetchGuestbook() {
            const listEl = document.getElementById("guestbookList");
            listEl.innerHTML = `
                <div class="text-center py-10 text-stone-400 text-xs font-light">
                    <i class="fa-solid fa-spinner fa-spin text-stone-300 text-lg mb-2"></i>
                    <p>방명록 데이터를 불러오는 중입니다...</p>
                </div>
            `;

            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const json = await response.json();

                if (json.status === "success" && json.data && json.data.length > 0) {
                    listEl.innerHTML = json.data.map(item => `
                        <div class="p-4 rounded-lg bg-stone-50 border border-stone-100 hover:border-stone-200 transition-colors">
                            <div class="flex items-center justify-between mb-1.5">
                                <span class="font-bold text-xs sm:text-sm text-stone-800">${escapeHtml(item.name)}</span>
                                <span class="text-[11px] text-stone-400 font-mono">${escapeHtml(item.time)}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-stone-600 leading-relaxed font-light whitespace-pre-wrap">${escapeHtml(item.message)}</p>
                        </div>
                    `).join("");
                } else {
                    listEl.innerHTML = `
                        <div class="text-center py-10 text-stone-400 text-xs font-light">
                            <p>아직 작성된 방명록이 없습니다. 첫 번째 방명록을 남겨보세요!</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("방명록 로딩 오류:", err);
                listEl.innerHTML = `
                    <div class="text-center py-8 text-stone-400 text-xs">
                        <p class="text-rose-500 font-medium mb-1">방명록을 불러오는 데 실패했습니다.</p>
                        <p class="text-[11px]">잠시 후 다시 시도해 주세요.</p>
                    </div>
                `;
            }
        }

        // 방명록 등록하기 (POST - CORS 에러 없는 text/plain 전송 방식)
        async function submitGuestbook(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById("gbName");
            const messageInput = document.getElementById("gbMessage");
            const btn = document.getElementById("gbSubmitBtn");

            const name = nameInput.value.trim();
            const message = messageInput.value.trim();

            if (!name || !message) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>등록 중...</span>`;

            try {
                // CORS Preflight 옵션을 피하기 위해 Content-Type을 text/plain으로 설정하여 전송
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({ name: name, message: message })
                });

                // 성공 처리
                nameInput.value = "";
                messageInput.value = "";
                await fetchGuestbook();
            } catch (err) {
                console.error("방명록 제출 오류:", err);
                alert("방명록 등록 중 오류가 발생했습니다. 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>작성 완료</span> <i class="fa-solid fa-paper-plane text-xs"></i>`;
            }
        }

        // HTML 태그 이스케이프 (XSS 방지)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 페이지 로드시 방명록 가져오기
        window.addEventListener("DOMContentLoaded", fetchGuestbook);
    </script>
